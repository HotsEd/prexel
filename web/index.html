<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
        Brand favicons. Modern browsers pick the SVG (sharp at any DPR,
        ~250B); legacy / Safari pre-15 fall back to the .ico. The SVG
        is the simplified mark — teal tile + emerald dot, no rings —
        because at ≤24px the concentric rings disappear into a noisy
        edge. apple-touch-icon uses the squircle app-icon variant.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="theme-color" content="#063D3A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prexel — Deploy without limits.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
