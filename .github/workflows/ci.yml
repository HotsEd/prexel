name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs are currently disabled with `if: false` until the underlying tooling
# catches up:
#
#   * go-lint: golangci-lint v1.64.8 ships a binary compiled with Go 1.24, which
#     refuses to lint a module whose `go` directive is 1.25+. We will re-enable
#     once we migrate `.golangci.yml` to the v2 schema and bump the action to
#     `version: latest` (v2.x).
#   * web-test: the project does not have any Vitest test files yet; vitest
#     exits with code 1 when no tests are found. We will re-enable once the
#     first frontend test lands.
#
# Both jobs stay visible in the workflow file so the next contributor sees the
# intent and the path back to green — flip `if: false` to remove the guard.

jobs:
  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    if: false  # TODO: re-enable after migrating to golangci-lint v2 + Go 1.25 build.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache: true
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - uses: golangci/golangci-lint-action@8564da7cb3c6866ed1da648ca8f00a258ef0c802 # v6.5.2
        with:
          version: latest

  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache: true
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: go test
        run: go test -race -cover ./...

  web-build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build

  web-test:
    name: web test
    runs-on: ubuntu-latest
    if: false  # TODO: re-enable once the first Vitest test file lands.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run test

  docker-build:
    name: docker build (production)
    runs-on: ubuntu-latest
    needs: [go-test, web-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: build/package/Dockerfile
          push: false
          tags: prexel:ci
